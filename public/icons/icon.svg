<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  <!-- Ambient glow -->
  <radialGradient id="g" cx="50%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- "L" mark for Luis -->
  <text x="256" y="310" font-family="Inter,system-ui,sans-serif" font-weight="800"
        font-size="220" fill="#00C8FF" text-anchor="middle" dominant-baseline="middle"
        style="letter-spacing:-8px">L</text>
  <!-- Subtle dot accent -->
  <circle cx="336" cy="188" r="18" fill="#00C8FF" opacity="0.8"/>
</svg>
